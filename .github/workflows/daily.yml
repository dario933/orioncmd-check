name: Daily OrionCmd certificate checks
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        url: ['https://www.orioncmd.com', 'https://orioncmd.com']
    steps:
      - name: Check the live OrionCmd website
        uses: dario933/orioncmd-check@v1
        with:
          url: ${{ matrix.url }}
          minimum-days: '21'
          attempts: '3'
          fail-on-error: 'true'
